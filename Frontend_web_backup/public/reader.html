<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trình Đọc Truyện Bảo Mật</title>

  <!-- Thư viện CryptoJS phục vụ giải mã AES -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #eaeaea;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      padding: 20px 10px;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }

    .story-card {
      width: 100%;
      max-width: 800px;
      background-color: #fff8eb; /* Màu giấy đọc sách ngà vàng */
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border-radius: 8px;
      padding: 20px;
    }

    .story-header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e0d7c6;
    }

    .story-header h1 {
      font-size: 22px;
      color: #333;
    }

    /* Thẻ Canvas chứa văn bản */
    #storyCanvas {
      display: block;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="story-card">
    <div class="story-header">
      <h1 id="chapterTitle">Đang tải nội dung...</h1>
    </div>

    <!-- Người dùng bấm Inspect Element vào đây chỉ thấy 1 thẻ canvas này -->
    <canvas id="storyCanvas"></canvas>
  </div>

<script>
  // Lưu trữ dữ liệu thô dạng cache local để phục vụ resize window
  let globalDecryptedText = "";

  function getJwtUserIdentifier() {
    try {
      const token = localStorage.getItem('accessToken') || localStorage.getItem('token');
      if (!token || !token.includes('.')) {
        return "GUEST_JWT";
      }
      const payloadBase64 = token.split('.')[1];
      const payloadJson = atob(payloadBase64.replace(/-/g, '+').replace(/_/g, '/'));
      const payload = JSON.parse(payloadJson);
      if (payload && (payload.sub || payload.email)) {
        return payload.sub || payload.email;
      }
      const userStr = localStorage.getItem('user');
      if (userStr) {
        const user = JSON.parse(userStr);
        if (user && user.email) return user.email;
      }
    } catch (e) {}
    return "GUEST_JWT";
  }

  /**
   * Sinh Dynamic Key động theo JWT Token của User và bối cảnh chương (Không dùng Secret Key cố định)
   * Công thức: SHA-256(jwtUserIdentifier + ":novel:" + novelId + ":chapter:" + chapterNumber + ":" + ivHex)
   */
  function deriveDynamicKey(novelId, chapterNumber, ivHex) {
    const userIdentifier = getJwtUserIdentifier();
    const contextId = `${userIdentifier}:novel:${novelId}:chapter:${chapterNumber}`;
    const seed = `${contextId}:${ivHex}`;
    return CryptoJS.SHA256(seed);
  }

  /**
   * 1. Hàm giải mã chuỗi HEX nhận từ Spring Boot API bằng Dynamic Key
   */
  function decryptData(encryptedHex, ivHex, novelId, chapterNumber) {
    if (!encryptedHex || !ivHex) return "";
    const key = deriveDynamicKey(novelId, chapterNumber, ivHex);
    const iv = CryptoJS.enc.Hex.parse(ivHex);
    const encryptedBase64 = CryptoJS.enc.Hex.parse(encryptedHex).toString(CryptoJS.enc.Base64);
    /**
     * 0. Bảng màu theme — PHẢI khớp với themeStyles trong reader-content.tsx (React)
     */
    const THEMES = {
      nocturne: { pageBg: '#0f0e11', cardBg: '#151419', text: '#e6e1e7', border: 'rgba(255,255,255,0.1)' },
      charcoal: { pageBg: '#16151a', cardBg: '#1e1e24', text: '#e3e1e6', border: 'rgba(255,255,255,0.1)' },
      sepia: { pageBg: '#eae0ca', cardBg: '#f4ebd4', text: '#4f3824', border: '#d2b48c' },
      ivory: { pageBg: '#fcf9f2', cardBg: '#FAF5E6', text: '#2C2512', border: 'rgba(0,0,0,0.1)' },
      day: { pageBg: '#f9f6fa', cardBg: '#ffffff', text: '#1c1b1f', border: 'rgba(0,0,0,0.1)' }
    };

    // Font family map — PHẢI khớp với logic trong CanvasArticle (reader-content.tsx)
    const FONT_FAMILIES = {
      serif: '"Georgia", "Merriweather", serif',
      sans: 'system-ui, "Segoe UI", Arial, sans-serif',
      mono: 'monospace'
    };

    // Hệ số line-height — PHẢI khớp với lhNum trong CanvasArticle
    const LINE_HEIGHT_RATIOS = {
      tight: 1.5,
      normal: 1.85,
      loose: 2.2
    };

    /**
     * Toàn bộ cấu hình hiển thị hiện tại — nguồn duy nhất mà renderCanvas() đọc vào.
     * Được cập nhật bởi applyConfig() (gọi lúc load từ URL, hoặc runtime từ postMessage).
     */
    const CONFIG = {
      theme: 'sepia',
      fontSize: 18,
      fontFamily: 'sans',
      lineHeight: 'normal',
      fullFrame: false
    };

    /**
     * Áp 1 phần hoặc toàn bộ cấu hình mới: cập nhật CSS variables (khung/HTML)
     * và vẽ lại canvas (chữ) nếu đã có nội dung.
     */
    function applyConfig(partial) {
      Object.assign(CONFIG, partial);

      const t = THEMES[CONFIG.theme] || THEMES.sepia;
      const root = document.documentElement.style;
      root.setProperty('--page-bg', t.pageBg);
      root.setProperty('--card-bg', t.cardBg);
      root.setProperty('--text-color', t.text);
      root.setProperty('--border-color', t.border);
      root.setProperty('--card-max-width', CONFIG.fullFrame ? '100%' : '800px');

      if (globalDecryptedText) renderCanvas(globalDecryptedText);
    }

    /**
     * 1. Hàm giải mã chuỗi HEX nhận từ Spring Boot API
     */
    function decryptData(encryptedHex, ivHex) {
      if (!encryptedHex || !ivHex) return "";
      const key = CryptoJS.enc.Utf8.parse(SECRET_KEY_STR);
      const iv = CryptoJS.enc.Hex.parse(ivHex);
      const encryptedBase64 = CryptoJS.enc.Hex.parse(encryptedHex).toString(CryptoJS.enc.Base64);

      const decrypted = CryptoJS.AES.decrypt(encryptedBase64, key, {
        iv: iv,
        mode: CryptoJS.mode.CBC,
        padding: CryptoJS.pad.Pkcs7
      });

      return decrypted.toString(CryptoJS.enc.Utf8);
    }

    /**
     * 2. Thuật toán vẽ văn bản lên Canvas
     */
    function renderCanvas(text) {
      if (!text) return;

      const canvas = document.getElementById('storyCanvas');
      const ctx = canvas.getContext('2d');

      // Cấu hình Font và khoảng cách — lấy theo CONFIG hiện tại (đồng bộ với reader-config-menu)
      const fontSize = CONFIG.fontSize;
      const fontFamilyCss = FONT_FAMILIES[CONFIG.fontFamily] || FONT_FAMILIES.sans;
      const lineHeight = fontSize * (LINE_HEIGHT_RATIOS[CONFIG.lineHeight] ?? LINE_HEIGHT_RATIOS.normal);
      const padding = 15;
      const fontStyle = `${fontSize}px ${fontFamilyCss}`;

      const parentWidth = canvas.parentElement.clientWidth - 40; // Trừ padding container
      const maxWidth = parentWidth - (padding * 2);

      ctx.font = fontStyle;

      // Tách văn bản theo các đoạn (xuống dòng \n)
      const paragraphs = text.split('\n');
      const lines = [];

      paragraphs.forEach(paragraph => {
        if (paragraph.trim() === '') {
          lines.push(''); // Thêm dòng trống giữa các đoạn
          return;
        }

        const words = paragraph.split(' ');
        let currentLine = '';

        for (let i = 0; i < words.length; i++) {
          const testLine = currentLine + words[i] + ' ';
          if (ctx.measureText(testLine).width > maxWidth && i > 0) {
            lines.push(currentLine);
            currentLine = words[i] + ' ';
          } else {
            currentLine = testLine;
          }
        }
        lines.push(currentLine);
      });

      // Cấu hình tỷ lệ hiển thị độ phân giải cao (Màn hình Retina / Điện thoại)
      const dpr = window.devicePixelRatio || 1;
      const totalHeight = (lines.length * lineHeight) + (padding * 2);

      canvas.width = parentWidth * dpr;
      canvas.height = totalHeight * dpr;
      canvas.style.width = `${parentWidth}px`;
      canvas.style.height = `${totalHeight}px`;

      ctx.scale(dpr, dpr);

      // Vẽ nền Canvas — lấy theo theme đang được chọn
      const themeColors = THEMES[CONFIG.theme] || THEMES.sepia;
      ctx.fillStyle = themeColors.cardBg;
      ctx.fillRect(0, 0, parentWidth, totalHeight);

      // Vẽ chữ
      ctx.font = fontStyle;
      ctx.fillStyle = themeColors.text;
      ctx.textBaseline = "top";

      lines.forEach((line, index) => {
        ctx.fillText(line.trim(), padding, padding + (index * lineHeight));
      });
    }

  /**
   * 3. Fetch dữ liệu từ Spring Boot API
   */
  async function loadChapter(novelId = 1, chapterNumber = 1) {
    try {
      const token = localStorage.getItem('accessToken') || localStorage.getItem('token');
      const headers = {};
      if (token) {
        headers['Authorization'] = `Bearer ${token}`;
      }
      
      // 1. Fetch all chapters for the novel
      const chaptersResponse = await fetch(`http://localhost:8080/api/novels/${novelId}/chapters`, { headers });
      if (!chaptersResponse.ok) {
        throw new Error("Không thể tải danh sách chương");
      }
      const chaptersResBody = await chaptersResponse.json();
      const chaptersList = chaptersResBody.result || [];
      
      // 2. Find target chapter by chapterNumber
      const targetChapter = chaptersList.find(c => Number(c.chapterNumber) === Number(chapterNumber));
      if (!targetChapter) {
        throw new Error(`Không tìm thấy chương số ${chapterNumber}`);
      }
      
      // 3. Fetch chapter details using the resolved targetChapter.id
      const response = await fetch(`http://localhost:8080/api/novels/${novelId}/chapters/${targetChapter.id}`, { headers });
      if (!response.ok) {
        throw new Error("Không thể tải chương truyện");
      }

      const resBody = await response.json();
      const data = resBody.result || resBody;

      if (data) {
        // Đổi tiêu đề chương
        document.getElementById('chapterTitle').innerText = `${data.title || 'Chương ' + chapterNumber}`;

        // Giải mã nội dung
        if (data.encryptedData && data.iv) {
          globalDecryptedText = decryptData(data.encryptedData, data.iv, data.novelId || novelId, data.chapterNumber || chapterNumber);
        } else {
          globalDecryptedText = data.content || "";
        }

        // Vẽ lên Canvas
        renderCanvas(globalDecryptedText);
      }
    } catch (err) {
      document.getElementById('chapterTitle').innerText = "Lỗi: " + err.message;
    }
  }

    // --- CÁC BIỆN PHÁP CHẶN THAO TÁC BỎ BỔ SUNG ---
    document.addEventListener('contextmenu', e => e.preventDefault()); // Chặn chuột phải
    document.addEventListener('selectstart', e => e.preventDefault()); // Chặn bôi đen
    document.addEventListener('keydown', e => {
      // Chặn F12, Ctrl+Shift+I, Ctrl+U, Ctrl+S
      if (e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) ||
        (e.ctrlKey && ['U', 'S'].includes(e.key.toUpperCase()))) {
        e.preventDefault();
      }
    });

    // Khởi chạy tải Chương ID novel = 21, chapterNumber = 1 (hoặc mặc định)
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const novelId = urlParams.get('novelId') || 21;
      const chapterNumber = urlParams.get('chapter') || 1;

      // Đọc cấu hình hiển thị ban đầu từ URL, ví dụ:
      // reader.html?novelId=21&chapter=1&theme=nocturne&fontSize=20&fontFamily=serif&lineHeight=loose&fullFrame=true
      applyConfig({
        theme: THEMES[urlParams.get('theme')] ? urlParams.get('theme') : CONFIG.theme,
        fontSize: urlParams.get('fontSize') ? Number(urlParams.get('fontSize')) : CONFIG.fontSize,
        fontFamily: FONT_FAMILIES[urlParams.get('fontFamily')] ? urlParams.get('fontFamily') : CONFIG.fontFamily,
        lineHeight: LINE_HEIGHT_RATIOS[urlParams.get('lineHeight')] ? urlParams.get('lineHeight') : CONFIG.lineHeight,
        fullFrame: urlParams.get('fullFrame') === 'true'
      });

      loadChapter(novelId, chapterNumber);
    });

    // Lắng nghe cấu hình mới gửi từ trang cha (React) qua postMessage, ví dụ:
    // iframeEl.contentWindow.postMessage({
    //   type: 'SET_READER_CONFIG',
    //   config: { theme, fontSize, fontFamily, lineHeight, fullFrame }
    // }, '*')
    // Có thể gửi config đầy đủ hoặc chỉ 1 phần (partial update) — applyConfig sẽ merge vào CONFIG hiện tại.
    window.addEventListener('message', (event) => {
      const msg = event.data;
      if (msg && msg.type === 'SET_READER_CONFIG' && msg.config) {
        applyConfig(msg.config);
      }
    });

    // Tự vẽ lại khi đổi kích thước màn hình
    window.addEventListener('resize', () => renderCanvas(globalDecryptedText));
  </script>

</body>

</html>
