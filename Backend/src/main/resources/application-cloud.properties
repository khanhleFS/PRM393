# Activate with SPRING_PROFILES_ACTIVE=cloud. Independent from the destructive local MSSQL initializer.
server.port=${PORT:8080}

spring.datasource.url=jdbc:sqlserver://${DB_HOST}:1433;databaseName=${DB_NAME};encrypt=true;trustServerCertificate=false;loginTimeout=60
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
# For a NEW EMPTY database only, use JPA_DDL_AUTO=update once, then return to validate.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.sql.init.mode=never
spring.jpa.open-in-view=false

# Small pool, no permanently idle sessions that keep Azure SQL serverless awake.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=90000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=0

# Upstash native Redis connection (not its HTTPS REST endpoint/token).
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true
spring.data.redis.connect-timeout=10s
spring.data.redis.timeout=10s

app.mail.provider=${MAIL_PROVIDER:resend}
cookie.secure=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Render supplies its actual public HTTPS URL; no guessed hostnames in source control.
momo.dev.redirect-url=${DEV_MOMO_REDIRECT_URL:${RENDER_EXTERNAL_URL:}/payment-result.html}
momo.dev.ipn-url=${DEV_MOMO_IPN_URL:${RENDER_EXTERNAL_URL:}/api/orders/momo/callback}
