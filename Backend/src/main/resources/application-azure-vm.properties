# Single-host Docker stack; independent from the destructive local MSSQL initializer.
server.port=8080
spring.datasource.url=jdbc:sqlserver://${DB_HOST:db}:1433;databaseName=${DB_NAME:luminovels};encrypt=true;trustServerCertificate=true;loginTimeout=30
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.sql.init.mode=never
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# Native Redis is isolated on the Docker network; only Caddy exposes public ports.
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=false
spring.data.redis.timeout=5s

app.mail.provider=${MAIL_PROVIDER:smtp}
cookie.secure=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
momo.dev.redirect-url=${PUBLIC_BASE_URL}/payment-result.html
momo.dev.ipn-url=${PUBLIC_BASE_URL}/api/orders/momo/callback
momo.mobile.redirect-url=
